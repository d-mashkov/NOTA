name: Process Pending Ideas

on:
  # Триггер от сервера при новом запросе
  repository_dispatch:
    types: [process-idea]
  # Fallback: каждые 10 минут подбирает незапущенные
  schedule:
    - cron: '*/10 * * * *'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -q anthropic supabase python-dotenv exa-py requests praw python-telegram-bot beautifulsoup4 lxml

      - name: Run poller (single pass)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python pipeline/github_worker.py
