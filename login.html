<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOTA — Вход</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">Н</div>
          <span style="font-size: 20px; font-weight: 700">NOTA</span>
        </div>

        <h1 class="auth-title">Добро пожаловать</h1>
        <p class="auth-subtitle">
          Закрытый сервис FMCG-трендов.<br />Введите email и пароль.
        </p>

        <!-- Форма входа -->
        <div id="step-login">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input
              type="email"
              id="input-email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Пароль</label>
            <input
              type="password"
              id="input-password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
          <button class="btn btn-primary btn-full" onclick="signIn()">
            Войти
          </button>
        </div>

        <!-- Ошибка доступа -->
        <div id="step-denied" style="display: none">
          <div class="empty-state">
            <div class="empty-state-icon">🔒</div>
            <div class="empty-state-title">Доступ закрыт</div>
            <p class="empty-state-text">
              Этот email не добавлен в список доступа.<br />Обратитесь к
              администратору.
            </p>
          </div>
          <button class="btn btn-ghost btn-full" onclick="backToLogin()">
            ← Попробовать другой email
          </button>
        </div>

        <!-- Статус / ошибка -->
        <div
          id="auth-error"
          style="
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: #fef2f2;
            border-radius: 8px;
            color: #ef4444;
            font-size: 14px;
          "
        ></div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase-client.js";

      async function signIn() {
        const email = document.getElementById("input-email").value.trim();
        const password = document.getElementById("input-password").value;
        if (!email) return showError("Введите email");
        if (!password) return showError("Введите пароль");

        showError("Входим...");

        // Проверяем белый список
        const { data: user } = await supabase
          .from("users")
          .select("id, is_active")
          .eq("email", email)
          .single();

        if (!user || !user.is_active) {
          showDenied();
          return;
        }

        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return showError("Неверный email или пароль");

        window.location.href = "index.html";
      }

      function backToLogin() {
        document.getElementById("step-login").style.display = "block";
        document.getElementById("step-denied").style.display = "none";
        hideError();
      }

      function showDenied() {
        document.getElementById("step-login").style.display = "none";
        document.getElementById("step-denied").style.display = "block";
      }

      function showError(msg) {
        const el = document.getElementById("auth-error");
        el.textContent = msg;
        el.style.display = "block";
      }
      function hideError() {
        document.getElementById("auth-error").style.display = "none";
      }

      // Enter для отправки формы
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") signIn();
      });

      window.signIn = signIn;
      window.backToLogin = backToLogin;
    </script>
  </body>
</html>
