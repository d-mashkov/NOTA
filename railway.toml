[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[cron]]
schedule = "0 9 * * *"
command = "python pipeline/daily_digest.py"

[[cron]]
schedule = "0 6 * * 1"
command = "python -c \"import sys; sys.path.insert(0,'.'); from pipeline.run_launch_ideas import run; run(limit=5)\""
