<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOTA — Идеи для запуска</title>
    <link rel="stylesheet" href="css/main.css" />
    <style>
      /* ── Launch ideas grid ── */
      .ideas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
        gap: 24px;
      }

      .idea-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        transition: box-shadow 0.2s, transform 0.15s;
      }
      .idea-card:hover {
        box-shadow: 0 8px 32px rgba(0,0,0,0.10);
        transform: translateY(-2px);
      }

      .idea-card-top {
        padding: 24px 24px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }
      .idea-card-info { flex: 1; min-width: 0; }
      .idea-category {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .idea-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.3;
        margin-bottom: 10px;
      }
      .idea-summary {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.55;
      }

      /* Score circle */
      .idea-score {
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 800;
        border: 3px solid;
      }
      .idea-score.high { color: var(--green); border-color: var(--green); background: rgba(34,197,94,0.07); }
      .idea-score.mid  { color: #f59e0b; border-color: #f59e0b; background: rgba(245,158,11,0.07); }
      .idea-score.low  { color: var(--red); border-color: var(--red); background: rgba(239,68,68,0.07); }

      /* Agent verdicts */
      .idea-agents {
        padding: 12px 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .agent-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 12px;
        line-height: 1.45;
      }
      .agent-dot {
        flex-shrink: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-top: 4px;
      }
      .agent-name {
        font-weight: 600;
        white-space: nowrap;
        min-width: 58px;
        color: var(--text);
      }
      .agent-text { color: var(--text-muted); }

      /* Colors */
      .dot-red    { background: #ef4444; }
      .dot-yellow { background: #f59e0b; }
      .dot-blue   { background: #3b82f6; }
      .dot-cart   { background: #10b981; }
      .dot-purple { background: #8b5cf6; }

      /* Detail button */
      .idea-footer {
        padding: 0 24px 20px;
      }
      .idea-detail-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 0.15s;
      }
      .idea-detail-btn:hover { opacity: 0.88; }

      /* Search bar compact */
      .search-bar {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        max-width: 640px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      }
      .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 14px;
        color: var(--text);
      }
      .search-bar input::placeholder { color: var(--text-muted); }
      .search-bar button {
        padding: 7px 18px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .search-bar button:hover { opacity: 0.88; }

      /* Skeleton loader */
      .skeleton-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        height: 320px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .skel-line {
        background: var(--border);
        border-radius: 6px;
        margin-bottom: 12px;
      }

      .refresh-btn {
        padding: 7px 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

      /* Spinner inside refresh btn */
      .spin { display: inline-block; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Навигация -->
    <nav class="nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">
          <div class="nav-logo-icon">Н</div>
          NOTA
        </a>
        <div class="nav-links">
          <a href="index.html" class="nav-link active">Идеи запуска</a>
          <a href="notes.html" class="nav-link">Лента NOTы</a>
          <a href="news.html" class="nav-link">Новости</a>
          <a href="profile.html" class="nav-link">Сохранённые</a>
          <a href="admin.html" class="nav-link" id="admin-link" style="display:none">Админка</a>
        </div>
        <div class="nav-user">
          <div class="nav-avatar" id="nav-avatar">?</div>
          <span class="nav-user-name" id="nav-name">...</span>
          <button class="btn btn-ghost text-sm" onclick="signOut()">Выйти</button>
        </div>
      </div>
    </nav>

    <main class="page">
      <!-- Header -->
      <div class="page-header" style="margin-bottom: 20px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;">
          <div>
            <h1 class="page-title">Идеи для запуска</h1>
            <p class="page-subtitle">Агенты NOTA проработали ниши — каждый со своей стороны</p>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
            <button class="refresh-btn" id="refresh-btn" onclick="loadIdeas()" style="display:none">
              ↻ Обновить
            </button>
          </div>
        </div>

        <!-- Compact search (admin only) -->
        <div id="search-bar" style="display:none;margin-top:18px;">
          <div class="search-bar">
            <span style="font-size:16px;">🔍</span>
            <input type="text" id="req-name" placeholder="Введи нишу для анализа..." onkeydown="if(event.key==='Enter') submitRequest()" />
            <input type="text" id="req-name-en" placeholder="English (опц.)" style="width:160px;border-left:1px solid var(--border);padding-left:10px;margin-left:4px;" />
            <button onclick="submitRequest()">Анализировать</button>
          </div>
          <div id="req-status" style="margin-top:8px;font-size:13px;display:none;"></div>
        </div>
      </div>

      <!-- Ideas section -->
      <div class="section" style="margin-top:0;">
        <div id="ideas-container">
          <!-- Skeleton -->
          <div class="ideas-grid" id="ideas-skeleton">
            <div class="skeleton-card">
              <div class="skel-line" style="width:30%;height:12px;"></div>
              <div class="skel-line" style="width:70%;height:20px;"></div>
              <div class="skel-line" style="width:90%;height:13px;margin-top:8px;"></div>
              <div class="skel-line" style="width:75%;height:13px;"></div>
              <div style="margin-top:20px;">
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:80%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:70%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
              </div>
            </div>
            <div class="skeleton-card">
              <div class="skel-line" style="width:25%;height:12px;"></div>
              <div class="skel-line" style="width:65%;height:20px;"></div>
              <div class="skel-line" style="width:85%;height:13px;margin-top:8px;"></div>
              <div class="skel-line" style="width:70%;height:13px;"></div>
              <div style="margin-top:20px;">
                <div class="skel-line" style="width:80%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:75%;height:11px;"></div>
                <div class="skel-line" style="width:80%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
              </div>
            </div>
            <div class="skeleton-card">
              <div class="skel-line" style="width:35%;height:12px;"></div>
              <div class="skel-line" style="width:60%;height:20px;"></div>
              <div class="skel-line" style="width:90%;height:13px;margin-top:8px;"></div>
              <div class="skel-line" style="width:80%;height:13px;"></div>
              <div style="margin-top:20px;">
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:75%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:70%;height:11px;"></div>
                <div class="skel-line" style="width:80%;height:11px;"></div>
              </div>
            </div>
            <div class="skeleton-card">
              <div class="skel-line" style="width:28%;height:12px;"></div>
              <div class="skel-line" style="width:72%;height:20px;"></div>
              <div class="skel-line" style="width:88%;height:13px;margin-top:8px;"></div>
              <div class="skel-line" style="width:65%;height:13px;"></div>
              <div style="margin-top:20px;">
                <div class="skel-line" style="width:80%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:75%;height:11px;"></div>
                <div class="skel-line" style="width:85%;height:11px;"></div>
                <div class="skel-line" style="width:70%;height:11px;"></div>
              </div>
            </div>
          </div>
          <div class="ideas-grid" id="ideas-grid" style="display:none;"></div>
        </div>
      </div>
    </main>

    <script type="module">
      import {
        requireAuth,
        getCurrentUser,
        getNotes,
        signOut as _signOut,
        supabase,
      } from "./js/supabase-client.js";

      window.signOut = _signOut;

      function scoreClass(s) {
        if (s >= 80) return "high";
        if (s >= 60) return "mid";
        return "low";
      }

      function renderIdeas(ideas) {
        const grid = document.getElementById("ideas-grid");
        if (!ideas || !ideas.length) {
          grid.innerHTML = `
            <div class="card" style="grid-column:1/-1;padding:48px;text-align:center;">
              <div style="font-size:40px;margin-bottom:12px;">🤖</div>
              <div style="font-size:17px;font-weight:600;margin-bottom:6px;">Идеи генерируются...</div>
              <div style="color:var(--text-muted);font-size:14px;">Агенты анализируют ниши — обычно это занимает пару минут</div>
            </div>`;
          return;
        }

        grid.innerHTML = ideas.map(idea => {
          const sc = scoreClass(idea.score || 0);
          const agents = [
            { dot: 'dot-red',    name: 'Артём',   text: extractVerdict(idea.artem) },
            { dot: 'dot-yellow', name: 'Петя',    text: extractVerdict(idea.petya) },
            { dot: 'dot-blue',   name: 'Вова',    text: extractVerdict(idea.vova) },
            { dot: 'dot-cart',   name: 'Авоська', text: extractVerdict(idea.avoska) },
            { dot: 'dot-purple', name: 'Поля',    text: extractVerdict(idea.polya) },
          ];

          return `
          <div class="idea-card">
            <div class="idea-card-top">
              <div class="idea-card-info">
                <div class="idea-category">${escHtml(idea.category || 'FMCG')}</div>
                <div class="idea-title">${escHtml(idea.title)}</div>
                <div class="idea-summary">${escHtml(idea.summary || '')}</div>
              </div>
              <div class="idea-score ${sc}">${idea.score || '—'}</div>
            </div>
            <div class="idea-agents">
              ${agents.map(a => `
                <div class="agent-row">
                  <div class="agent-dot ${a.dot}"></div>
                  <div class="agent-name">${a.name}</div>
                  <div class="agent-text">${escHtml(a.text)}</div>
                </div>
              `).join('')}
            </div>
            <div class="idea-footer">
              <a href="idea-detail.html?id=${idea.id}" class="idea-detail-btn">
                Ознакомиться →
              </a>
            </div>
          </div>`;
        }).join('');
      }

      function extractVerdict(agentData) {
        if (!agentData) return '—';
        // Format: "🔴 Verdict sentence\n\nFull data..."
        // Extract just the first line (verdict)
        const firstLine = agentData.split('\n')[0];
        // Strip emoji prefix (e.g. "🔴 ")
        return firstLine.replace(/^[\u{1F300}-\u{1FFFF}\u{2700}-\u{27BF}\u{FE00}-\u{FEFF}🛒🟣🟡🔵🔴\s]+/u, '').trim() || agentData.slice(0, 100);
      }

      function escHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      window.loadIdeas = async function() {
        const btn = document.getElementById("refresh-btn");
        btn.innerHTML = '<span class="spin">↻</span> Обновляем...';
        btn.disabled = true;

        const { data } = await supabase
          .from("launch_ideas")
          .select("*")
          .eq("status", "active")
          .order("score", { ascending: false });

        document.getElementById("ideas-skeleton").style.display = "none";
        document.getElementById("ideas-grid").style.display = "grid";
        renderIdeas(data || []);

        btn.innerHTML = '↻ Обновить';
        btn.disabled = false;
      }

      async function init() {
        await requireAuth();
        const user = await getCurrentUser();
        if (!user) return;

        document.getElementById("nav-avatar").textContent =
          user.name?.[0]?.toUpperCase() || user.email[0].toUpperCase();
        document.getElementById("nav-name").textContent = user.name || user.email;

        if (user.role === "admin") {
          document.getElementById("admin-link").style.display = "block";
          document.getElementById("search-bar").style.display = "block";
          document.getElementById("refresh-btn").style.display = "block";
        }

        // Load ideas
        const { data } = await supabase
          .from("launch_ideas")
          .select("*")
          .eq("status", "active")
          .order("score", { ascending: false });

        document.getElementById("ideas-skeleton").style.display = "none";
        document.getElementById("ideas-grid").style.display = "grid";
        renderIdeas(data || []);
      }

      window.submitRequest = async function() {
        const name = document.getElementById("req-name").value.trim();
        if (!name) return;
        const statusEl = document.getElementById("req-status");
        statusEl.style.display = "block";
        statusEl.style.color = "#f59e0b";
        statusEl.textContent = "⏳ Добавляем нишу — агенты начнут анализ при следующем запуске...";
        document.getElementById("req-name").value = "";
        document.getElementById("req-name-en").value = "";
      };

      init();
    </script>
  </body>
</html>
