<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOTA — Идеи для запуска</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/svg+xml" href="img/nota-icon.svg">
  <style>
    /* ── Hero ── */
    .hero {
      margin-bottom: 36px;
    }
    .hero-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .hero-sub {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ── Идеи — компактная сетка ── */
    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    /* ── Минималистичная карточка — iOS 26 Glass ── */
    .idea-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.18);
      box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all 0.22s ease;
      position: relative;
      overflow: hidden;
    }
    .idea-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59,130,246,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.22s;
    }
    .idea-card:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }
    .idea-card:hover::before { opacity: 1; }

    .idea-card-body { flex: 1; min-width: 0; }
    .idea-card-cat {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .idea-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .idea-card-date {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .idea-card-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    /* ── Скор ── */
    .idea-score {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid;
      position: relative;
    }
    .idea-score-num {
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .idea-score-lbl {
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
    }
    .idea-score.high {
      color: var(--green); border-color: var(--green); background: var(--green-dim);
      box-shadow: 0 0 20px rgba(16,185,129,0.4), 0 0 6px rgba(16,185,129,0.2);
    }
    .idea-score.mid  {
      color: var(--yellow); border-color: var(--yellow); background: var(--yellow-dim);
      box-shadow: 0 0 20px rgba(245,158,11,0.4), 0 0 6px rgba(245,158,11,0.2);
    }
    .idea-score.low  {
      color: var(--red); border-color: var(--red); background: var(--red-dim);
      box-shadow: 0 0 20px rgba(239,68,68,0.4), 0 0 6px rgba(239,68,68,0.2);
    }

    /* ── Стрелка ── */
    .idea-arrow {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 16px;
      transition: transform 0.15s, color 0.15s;
    }
    .idea-card:hover .idea-arrow { transform: translateX(3px); color: var(--accent); }

    /* ── Топ-бар ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-filter {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.18s;
    }
    .group-filter:hover {
      border-color: rgba(255,255,255,0.18);
      color: var(--text-secondary);
      background: rgba(255,255,255,0.09);
    }
    .group-filter.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 20px rgba(59,130,246,0.4);
    }
    .refresh-btn { display: none; }

    /* ── Sort buttons ── */
    .sort-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sort-btn {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .sort-btn:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--text-secondary);
    }
    .sort-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.25);
      color: var(--text);
    }

    /* ── Admin inputs ── */
    .admin-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      max-width: 600px;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
    }
    .search-bar input {
      flex: 1; border: none; outline: none;
      background: transparent; font-size: 13px; color: var(--text);
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar button {
      padding: 6px 16px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 0 16px rgba(59,130,246,0.3);
    }
    .search-bar button:hover { opacity: 0.88; }

    /* ── JSON Upload ── */
    .json-upload-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(16,185,129,0.05);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(16,185,129,0.18);
      border-top-color: rgba(16,185,129,0.25);
      box-shadow: inset 0 1px 0 rgba(16,185,129,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .json-upload-bar:hover { border-color: rgba(16,185,129,0.35); background: rgba(16,185,129,0.08); }
    .json-upload-bar.drag-over {
      border-color: var(--green);
      background: rgba(16,185,129,0.12);
      box-shadow: 0 0 20px rgba(16,185,129,0.2), inset 0 1px 0 rgba(16,185,129,0.15);
    }
    .json-upload-icon { font-size: 16px; flex-shrink: 0; }
    .json-upload-label {
      flex: 1;
      font-size: 13px;
      color: var(--text-muted);
    }
    .json-upload-label strong { color: var(--green); font-weight: 600; }
    .json-upload-btn {
      padding: 6px 14px;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      color: var(--green);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .json-upload-btn:hover { background: rgba(16,185,129,0.25); box-shadow: 0 0 12px rgba(16,185,129,0.2); }
    #json-file-input { display: none; }
    .json-preview {
      margin-top: 8px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      display: none;
    }
    .json-preview.show { display: block; }
    .json-preview-title { font-weight: 700; color: var(--text); margin-bottom: 4px; font-size: 13px; }
    .json-preview-meta { color: var(--text-muted); line-height: 1.6; }
    .json-preview-actions {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .json-preview-actions button {
      padding: 5px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-confirm {
      background: var(--green); color: white;
      box-shadow: 0 0 12px rgba(16,185,129,0.3);
    }
    .btn-cancel-json {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
    }

    /* ── Skeleton ── */
    .skel-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,255,255,0.12);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .skel-line {
      background: rgba(255,255,255,0.07);
      border-radius: 5px;
      height: 12px;
    }
    .skel-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    /* ── Авторская метка на карточке ── */
    .author-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.28);
      border-radius: 20px;
      font-size: 10px; font-weight: 700;
      color: var(--green);
      box-shadow: 0 0 10px rgba(16,185,129,0.15);
      pointer-events: none;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .author-badge-stars {
      letter-spacing: -1px;
      font-size: 10px;
    }

    /* ── Пустое состояние ── */
    .ideas-empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }
    .ideas-empty-icon { font-size: 36px; margin-bottom: 12px; }
    .ideas-empty-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); }

    /* ── Принято-состояние строки поиска ── */
    .search-accepted {
      display: none;
      align-items: center;
      gap: 14px;
      background: rgba(16,185,129,0.08);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(16,185,129,0.28);
      border-top-color: rgba(16,185,129,0.38);
      box-shadow: 0 0 24px rgba(16,185,129,0.12), inset 0 1px 0 rgba(16,185,129,0.1);
      border-radius: 12px;
      padding: 14px 18px;
      animation: fadeInUp 0.4s ease;
    }
    .search-accepted.show { display: flex; }
    .search-accepted-icon {
      font-size: 24px;
      animation: spin-in 0.5s ease;
    }
    .search-accepted-body { flex: 1; }
    .search-accepted-title {
      font-size: 13px; font-weight: 700; color: var(--green);
      margin-bottom: 2px;
    }
    .search-accepted-sub {
      font-size: 12px; color: var(--text-muted);
    }
    .search-accepted-niche {
      font-weight: 700; color: var(--text);
    }
    .search-accepted-btn {
      padding: 6px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .search-accepted-btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }

    /* ── Pending-карточка ── */
    .idea-card-pending {
      background: rgba(59,130,246,0.06);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(59,130,246,0.2);
      border-top-color: rgba(59,130,246,0.35);
      box-shadow: 0 4px 24px rgba(59,130,246,0.15), inset 0 1px 0 rgba(59,130,246,0.1);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeInUp 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .idea-card-pending::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .pending-spinner {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(59,130,246,0.2);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pending-body { flex: 1; min-width: 0; }
    .pending-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin-bottom: 4px;
    }
    .pending-title {
      font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .pending-status {
      font-size: 11px; color: var(--text-muted);
    }
    .pending-eta {
      font-size: 10px; color: var(--accent);
      margin-top: 2px; font-weight: 600;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin-in {
      from { transform: scale(0) rotate(-90deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg); opacity: 1; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="img/nota-icon.svg" class="nav-logo-icon" alt="NOTA">
        NOTA
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Идеи запуска</a>
        <a href="notes.html" class="nav-link">Лента NOTы</a>
        <a href="news.html" class="nav-link">Новости</a>
        <a href="profile.html" class="nav-link">Сохранённые</a>
        <a href="admin.html" class="nav-link" id="admin-link" style="display:none">Админка</a>
      </div>
      <div class="nav-user">
        <div class="nav-avatar" id="nav-avatar">?</div>
        <span class="nav-user-name" id="nav-name">...</span>
        <button class="btn btn-ghost text-sm" onclick="signOut()">Выйти</button>
      </div>
    </div>
  </nav>

  <main class="page">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-label">NOTA Intelligence</div>
      <h1 class="hero-title">Идеи для запуска</h1>
      <p class="hero-sub">5 агентов проработали ниши — каждый со своей стороны. Нажми на идею, чтобы погрузиться.</p>
    </div>

    <!-- Admin inputs -->
    <div id="search-bar" style="display:none" class="admin-inputs">

      <!-- Строка ввода ниши -->
      <div id="search-input-bar" class="search-bar">
        <span style="font-size:15px;color:var(--text-muted)">🔍</span>
        <input type="text" id="req-name" placeholder="Введи нишу для анализа..." onkeydown="if(event.key==='Enter') submitRequest()" />
        <button id="analyze-btn" onclick="submitRequest()">Анализировать</button>
      </div>

      <!-- Принято-состояние -->
      <div id="search-accepted" class="search-accepted">
        <div class="search-accepted-icon">✅</div>
        <div class="search-accepted-body">
          <div class="search-accepted-title">Запрос принят — агенты работают</div>
          <div class="search-accepted-sub">Анализируем нишу <span id="accepted-niche" class="search-accepted-niche"></span> · ≈ 10–15 мин</div>
        </div>
        <button class="search-accepted-btn" onclick="resetSearchBar()">+ Ещё ниша</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left" id="group-filters">
        <button class="group-filter active" data-group="all" onclick="filterGroup('all',this)">Все</button>
      </div>
      <div class="sort-btns">
        <button class="sort-btn active" data-sort="date" onclick="setSort('date',this)">По дате ↓</button>
        <button class="sort-btn" data-sort="score" onclick="setSort('score',this)">По баллам</button>
        <button class="sort-btn" data-sort="reviewed" onclick="setSort('reviewed',this)">Прочитанные</button>
      </div>
    </div>

    <!-- Grid -->
    <div class="ideas-grid" id="ideas-grid">
      <!-- Skeleton -->
      <div class="skel-card">
        <div style="flex:1"><div class="skel-line" style="width:30%;margin-bottom:8px;"></div><div class="skel-line" style="width:75%;"></div></div>
        <div class="skel-circle"></div>
      </div>
      <div class="skel-card">
        <div style="flex:1"><div class="skel-line" style="width:25%;margin-bottom:8px;"></div><div class="skel-line" style="width:68%;"></div></div>
        <div class="skel-circle"></div>
      </div>
      <div class="skel-card">
        <div style="flex:1"><div class="skel-line" style="width:35%;margin-bottom:8px;"></div><div class="skel-line" style="width:80%;"></div></div>
        <div class="skel-circle"></div>
      </div>
      <div class="skel-card">
        <div style="flex:1"><div class="skel-line" style="width:28%;margin-bottom:8px;"></div><div class="skel-line" style="width:72%;"></div></div>
        <div class="skel-circle"></div>
      </div>
      <div class="skel-card">
        <div style="flex:1"><div class="skel-line" style="width:32%;margin-bottom:8px;"></div><div class="skel-line" style="width:65%;"></div></div>
        <div class="skel-circle"></div>
      </div>
    </div>

  </main>

  <script type="module">
    import { requireAuth, getCurrentUser, signOut as _signOut, supabase } from './js/supabase-client.js';
    window.signOut = _signOut;

    let allIdeas = [];

    function sc(score) {
      return score >= 80 ? 'high' : score >= 60 ? 'mid' : 'low';
    }
    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderIdeas(ideas) {
      const grid = document.getElementById('ideas-grid');
      if (!ideas.length) {
        grid.innerHTML = `
          <div class="ideas-empty">
            <div class="ideas-empty-icon">🤖</div>
            <div class="ideas-empty-title">Идеи генерируются...</div>
            <p style="font-size:13px;margin-top:6px;">Агенты анализируют ниши — обычно 10–15 минут</p>
          </div>`;
        return;
      }

      grid.innerHTML = ideas.map(idea => {
        const cls = sc(idea.score || 0);
        const detail = (() => { try { return JSON.parse(idea.detail_json||'{}'); } catch { return {}; } })();
        const group = detail.group || idea.category || '';
        const reviewed = idea.author_reviewed;
        const rating = idea.author_rating;
        const stars = rating ? '★'.repeat(rating) + '☆'.repeat(5 - rating) : '';
        const badge = reviewed
          ? `<div class="author-badge">✓ Прочитано${stars ? `<span class="author-badge-stars">${stars}</span>` : ''}</div>`
          : '';
        const dateStr = idea.created_at
          ? new Date(idea.created_at).toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'})
          : '';
        return `
        <a href="idea-detail.html?id=${idea.id}" class="idea-card">
          <div class="idea-card-body">
            <div class="idea-card-cat">${esc(idea.category || 'FMCG')}</div>
            <div class="idea-card-title">${esc(idea.title)}</div>
            <div class="idea-card-meta">${esc(group)} · нажми для аналитики</div>
            ${dateStr ? `<div class="idea-card-date">${dateStr}</div>` : ''}
            ${badge}
          </div>
          <div class="idea-score ${cls}" data-score="${idea.score||0}">
            <span class="idea-score-num">${idea.score||'—'}</span>
            <span class="idea-score-lbl">балл</span>
          </div>
          <span class="idea-arrow">›</span>
        </a>`;
      }).join('');
    }

    function buildGroupFilters(ideas) {
      const groups = [...new Set(ideas.map(i => {
        try { return JSON.parse(i.detail_json||'{}').group; } catch { return null; }
      }).filter(Boolean))];
      if (!groups.length) return;

      const bar = document.getElementById('group-filters');
      groups.forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'group-filter';
        btn.dataset.group = g;
        btn.textContent = g;
        btn.onclick = () => filterGroup(g, btn);
        bar.appendChild(btn);
      });
    }

    window.filterGroup = function(group, btn) {
      document.querySelectorAll('.group-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFiltersAndSort();
    };

    let currentSort = 'date';

    window.setSort = function(sort, btn) {
      currentSort = sort;
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFiltersAndSort();
    };

    function applyFiltersAndSort() {
      const activeGroup = document.querySelector('.group-filter.active')?.dataset.group || 'all';
      let ideas = activeGroup === 'all' ? [...allIdeas] : allIdeas.filter(i => {
        try { return JSON.parse(i.detail_json||'{}').group === activeGroup; } catch { return false; }
      });
      if (currentSort === 'score') {
        ideas.sort((a, b) => (b.score || 0) - (a.score || 0));
      } else if (currentSort === 'date') {
        ideas.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      } else if (currentSort === 'reviewed') {
        ideas.sort((a, b) => (b.author_reviewed ? 1 : 0) - (a.author_reviewed ? 1 : 0));
      }
      renderIdeas(ideas);
    }

    window.loadIdeas = async function() {
      const { data } = await supabase
        .from('launch_ideas').select('*')
        .eq('status','active')
        .order('created_at', { ascending: false });

      allIdeas = data || [];
      applyFiltersAndSort();
      buildGroupFilters(allIdeas);
    };

    // ── Analyze niche ──────────────────────────────────────────

    const API_BASE = `${location.protocol}//${location.hostname}`;
    const pendingPollers = {}; // id → intervalId

    window.submitRequest = async function() {
      const input = document.getElementById('req-name');
      const niche = input.value.trim();
      if (!niche) return;

      const btn = document.getElementById('analyze-btn');
      btn.textContent = '⏳ Отправляем...';
      btn.disabled = true;

      try {
        const resp = await fetch(`${API_BASE}/api/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ niche }),
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const { id } = await resp.json();

        // Показываем "принято"
        document.getElementById('search-input-bar').style.display = 'none';
        const accepted = document.getElementById('search-accepted');
        accepted.classList.add('show');
        document.getElementById('accepted-niche').textContent = `«${niche}»`;
        input.value = '';

        // Добавляем pending-карточку в начало грида
        addPendingCard(id, niche);

        // Запускаем поллинг
        startPolling(id);

      } catch (e) {
        btn.textContent = 'Анализировать';
        btn.disabled = false;
        alert('Ошибка отправки запроса. Проверь соединение.');
        console.error(e);
      }
    };

    window.resetSearchBar = function() {
      document.getElementById('search-input-bar').style.display = 'flex';
      const accepted = document.getElementById('search-accepted');
      accepted.classList.remove('show');
      const btn = document.getElementById('analyze-btn');
      btn.textContent = 'Анализировать';
      btn.disabled = false;
      document.getElementById('req-name').focus();
    };

    function addPendingCard(id, niche) {
      const grid = document.getElementById('ideas-grid');
      const el = document.createElement('div');
      el.className = 'idea-card-pending';
      el.id = `pending-${id}`;
      el.innerHTML = `
        <div class="pending-spinner"></div>
        <div class="pending-body">
          <div class="pending-label">Анализируется</div>
          <div class="pending-title">${esc(niche)}</div>
          <div class="pending-status">5 агентов изучают рынок, тренды и конкурентов...</div>
          <div class="pending-eta">⏱ Примерно 10–15 минут</div>
        </div>`;
      // Вставляем в начало грида
      grid.insertBefore(el, grid.firstChild);
    }

    function startPolling(id) {
      // Проверяем каждые 30 секунд
      const poll = setInterval(async () => {
        try {
          const resp = await fetch(`${API_BASE}/api/idea/${id}`);
          if (!resp.ok) return;
          const idea = await resp.json();

          if (idea.status === 'active') {
            clearInterval(poll);
            delete pendingPollers[id];
            replacePendingCard(id, idea);
          } else if (idea.status === 'failed') {
            clearInterval(poll);
            delete pendingPollers[id];
            showPendingError(id, idea.summary);
          }
        } catch (e) {
          console.error('Polling error:', e);
        }
      }, 30_000);
      pendingPollers[id] = poll;
    }

    function replacePendingCard(id, idea) {
      const el = document.getElementById(`pending-${id}`);
      if (!el) return;

      const cls = sc(idea.score || 0);
      const dateStr = idea.created_at
        ? new Date(idea.created_at).toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'})
        : '';

      // Создаём нормальную карточку
      const a = document.createElement('a');
      a.href = `idea-detail.html?id=${idea.id}`;
      a.className = 'idea-card';
      a.style.animation = 'fadeInUp 0.5s ease';
      a.innerHTML = `
        <div class="idea-card-body">
          <div class="idea-card-cat">${esc(idea.category || 'FMCG')}</div>
          <div class="idea-card-title">${esc(idea.title)}</div>
          <div class="idea-card-meta">нажми для аналитики</div>
          ${dateStr ? `<div class="idea-card-date">${dateStr}</div>` : ''}
        </div>
        <div class="idea-score ${cls}" data-score="${idea.score||0}">
          <span class="idea-score-num">${idea.score||'—'}</span>
          <span class="idea-score-lbl">балл</span>
        </div>
        <span class="idea-arrow">›</span>`;

      el.parentNode.replaceChild(a, el);

      // Добавляем в allIdeas и сбрасываем поиск
      allIdeas.unshift(idea);
      resetSearchBar();
    }

    function showPendingError(id, msg) {
      const el = document.getElementById(`pending-${id}`);
      if (!el) return;
      el.style.borderColor = 'rgba(239,68,68,0.3)';
      el.style.background = 'rgba(239,68,68,0.06)';
      el.querySelector('.pending-label').style.color = 'var(--red)';
      el.querySelector('.pending-label').textContent = 'Ошибка';
      el.querySelector('.pending-status').textContent = msg || 'Не удалось проанализировать нишу';
      el.querySelector('.pending-eta').textContent = '';
      el.querySelector('.pending-spinner').style.display = 'none';
    }

    // ── JSON Upload ──
    let _parsedJsonSeed = null;

    function extractSeedFromJson(data) {
      const brief = data?.session_meta?.brief || {};
      const naming = data?.naming_exploration || {};
      const project = data?.session_meta?.project || '';

      // Название
      const finalChoice = (naming.final_choice || '').split(' ')[0];
      const shortlist   = (naming.shortlist || [])[0] || '';
      let title = project.split('—')[0].trim() || finalChoice || shortlist || 'Новый продукт';

      // Категория и группа
      const category = brief.category || '';
      const market   = brief.market || 'Russia';
      const channel  = brief.channel_and_tier || 'D2C';

      let group = 'Другое';
      const catL = (category + title).toLowerCase();
      if (/bed|sleep|lyocell|постел|сон|tencel/.test(catL)) group = 'Сон';
      else if (/food|питан|напит/.test(catL)) group = 'Питание';
      else if (/beauty|skin|красот|уход/.test(catL)) group = 'Уход';
      else if (/home|дом|быт/.test(catL)) group = 'Дом';
      else if (/nicotine|табак|паучи|vape/.test(catL)) group = 'Никотин';

      // Query из категории + концептов
      const conceptKeys = Object.keys(data).filter(k => k.startsWith('concept_'));
      const statements = conceptKeys.flatMap(k => [
        data[k]?.positioning?.essence_statement_ru,
        data[k]?.positioning?.mission,
      ]).filter(Boolean).slice(0, 2);

      const query = [category, market, channel, ...statements].filter(Boolean).join(' | ').slice(0, 200);

      // Мета для превью
      const priceLabels = conceptKeys.map(k =>
        data[k]?.positioning?.price_positioning?.label
      ).filter(Boolean);
      const brands = (naming.shortlist || []).join(' / ');

      return {
        title,
        query,
        group,
        _brands: brands,
        _category: category,
        _market: market,
        _price: priceLabels[0] || '',
        _names: (naming.shortlist || []),
      };
    }

    window.handleDragOver = function(e) {
      e.preventDefault();
      document.getElementById('json-drop-zone').classList.add('drag-over');
    };
    window.handleDragLeave = function() {
      document.getElementById('json-drop-zone').classList.remove('drag-over');
    };
    window.handleDrop = function(e) {
      e.preventDefault();
      document.getElementById('json-drop-zone').classList.remove('drag-over');
      const file = e.dataTransfer?.files?.[0];
      if (file) handleJsonFile(file);
    };

    window.handleJsonFile = function(file) {
      if (!file || !file.name.endsWith('.json')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          const seed = extractSeedFromJson(data);
          _parsedJsonSeed = seed;

          // Показываем превью
          document.getElementById('json-preview-title').textContent = seed.title;
          document.getElementById('json-preview-meta').innerHTML = `
            <span style="color:var(--accent)">📂 ${seed.group}</span>
            ${seed._category ? ` · ${seed._category}` : ''}
            ${seed._market ? ` · ${seed._market}` : ''}<br>
            ${seed._brands ? `<span style="opacity:.7">Варианты бренда: ${seed._brands}</span><br>` : ''}
            ${seed._price ? `<span style="opacity:.7">Цена: ${seed._price}</span>` : ''}
            <br><span style="color:var(--green);margin-top:4px;display:inline-block">
              Агенты проверят рынок, маркетплейсы и тренды для этой идеи
            </span>`;
          document.getElementById('json-preview').classList.add('show');
        } catch {
          alert('Ошибка разбора JSON — проверь формат файла');
        }
      };
      reader.readAsText(file);
    };

    window.confirmJsonIdea = async function() {
      if (!_parsedJsonSeed) return;
      const st = document.getElementById('req-status');
      st.style.display = 'block';
      st.textContent = `⏳ «${_parsedJsonSeed.title}» отправлена агентам — запусти: python pipeline/run_from_json.py <файл.json>`;
      document.getElementById('json-preview').classList.remove('show');
      _parsedJsonSeed = null;
    };

    window.cancelJsonIdea = function() {
      document.getElementById('json-preview').classList.remove('show');
      _parsedJsonSeed = null;
    };

    async function init() {
      await requireAuth();
      const user = await getCurrentUser();
      if (!user) return;

      document.getElementById('nav-avatar').textContent = user.name?.[0]?.toUpperCase() || user.email[0].toUpperCase();
      document.getElementById('nav-name').textContent = user.name || user.email;
      if (user.role === 'admin') {
        document.getElementById('admin-link').style.display = 'block';
        document.getElementById('search-bar').style.display = 'block';
        // refresh-btn removed
      }

      const { data } = await supabase
        .from('launch_ideas').select('*')
        .eq('status','active')
        .order('created_at', { ascending: false });

      allIdeas = data || [];
      applyFiltersAndSort();
      buildGroupFilters(allIdeas);
    }

    init();
  </script>
</body>
</html>
