<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOTA — Админка</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">Н</div>
      NOTA
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="notes.html" class="nav-link">Лента NOTы</a>
      <a href="admin.html" class="nav-link active">Админка</a>
    </div>
    <div class="nav-user">
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span class="nav-user-name" id="nav-name">...</span>
      <button class="btn btn-ghost text-sm" onclick="signOut()">Выйти</button>
    </div>
  </div>
</nav>

<main class="page">

  <div class="page-header">
    <h1 class="page-title">Панель администратора</h1>
  </div>

  <!-- Вкладки -->
  <div class="filters" style="margin-bottom:32px;">
    <button class="filter-btn active" onclick="showTab('users',this)">👥 Пользователи</button>
    <button class="filter-btn" onclick="showTab('categories',this)">📂 Категории</button>
    <button class="filter-btn" onclick="showTab('notes',this)">📋 NOTы</button>
  </div>

  <!-- Пользователи -->
  <div id="tab-users">
    <div class="section-header" style="margin-bottom:16px;">
      <h2 class="section-title">Пользователи</h2>
      <button class="btn btn-primary" onclick="openAddUser()">+ Добавить</button>
    </div>

    <!-- Форма добавления -->
    <div id="add-user-form" style="display:none;" class="card card-body" style="margin-bottom:20px;">
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Email</label>
          <input type="email" id="new-user-email" class="form-input" placeholder="user@example.com"/>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Имя</label>
          <input type="text" id="new-user-name" class="form-input" placeholder="Иван Иванов"/>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Роль</label>
          <select id="new-user-role" class="form-input">
            <option value="user">user</option>
            <option value="analyst">analyst</option>
            <option value="admin">admin</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" onclick="addUser()">Добавить</button>
        <button class="btn btn-secondary" onclick="closeAddUser()">Отмена</button>
      </div>
    </div>

    <div class="card" style="overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;" id="users-table">
        <thead>
          <tr style="background:var(--surface-2);">
            <th style="text-align:left;padding:12px 20px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Email</th>
            <th style="text-align:left;padding:12px 20px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Имя</th>
            <th style="text-align:left;padding:12px 20px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Роль</th>
            <th style="text-align:left;padding:12px 20px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Статус</th>
            <th style="padding:12px 20px;"></th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted);">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Категории -->
  <div id="tab-categories" style="display:none;">
    <div class="section-header" style="margin-bottom:16px;">
      <h2 class="section-title">Seed-категории</h2>
      <button class="btn btn-primary" onclick="openAddCat()">+ Добавить</button>
    </div>

    <div id="add-cat-form" style="display:none;" class="card card-body" style="margin-bottom:20px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Название (RU)</label>
          <input type="text" id="new-cat-name" class="form-input" placeholder="ПП батончики"/>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Название (EN)</label>
          <input type="text" id="new-cat-name-en" class="form-input" placeholder="Protein bars"/>
        </div>
        <div class="form-group" style="margin:0;grid-column:1/-1;">
          <label class="form-label">Ключевые слова (через запятую)</label>
          <input type="text" id="new-cat-queries" class="form-input" placeholder="пп батончик, протеиновый батончик, батончик без сахара"/>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" onclick="addCategory()">Добавить</button>
        <button class="btn btn-secondary" onclick="closeCatForm()">Отмена</button>
      </div>
    </div>

    <div class="grid-3" id="cats-grid">
      <!-- JS -->
    </div>
  </div>

  <!-- NOTы -->
  <div id="tab-notes" style="display:none;">
    <div class="section-header" style="margin-bottom:16px;">
      <h2 class="section-title">Управление NOTами</h2>
    </div>
    <div id="admin-notes-list">
      <!-- JS -->
    </div>
  </div>

</main>

<script type="module">
  import { requireAuth, getCurrentUser, signOut as _signOut, supabase } from './js/supabase-client.js';

  window.signOut = _signOut;

  let currentUser = null;

  window.showTab = function(tab, btn) {
    ['users','categories','notes'].forEach(t => {
      document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
    });
    document.querySelectorAll('.filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (tab === 'users') loadUsers();
    if (tab === 'categories') loadCategories();
    if (tab === 'notes') loadAdminNotes();
  };

  // ---- Пользователи ----
  window.openAddUser = () => { document.getElementById('add-user-form').style.display = 'block'; };
  window.closeAddUser = () => { document.getElementById('add-user-form').style.display = 'none'; };

  window.addUser = async function() {
    const email = document.getElementById('new-user-email').value.trim();
    const name  = document.getElementById('new-user-name').value.trim();
    const role  = document.getElementById('new-user-role').value;
    if (!email) return;
    await supabase.from('users').insert({ email, name, role });
    closeAddUser();
    loadUsers();
  };

  window.toggleUserActive = async function(id, current) {
    await supabase.from('users').update({ is_active: !current }).eq('id', id);
    loadUsers();
  };

  async function loadUsers() {
    const { data } = await supabase.from('users').select('*').order('created_at');
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = (data||[]).map(u => `
      <tr style="border-top:1px solid var(--border);">
        <td style="padding:14px 20px;font-size:14px;">${u.email}</td>
        <td style="padding:14px 20px;font-size:14px;">${u.name||'—'}</td>
        <td style="padding:14px 20px;">
          <span class="badge ${u.role==='admin'?'badge-launch':u.role==='analyst'?'badge-growing':'badge-draft'}">${u.role}</span>
        </td>
        <td style="padding:14px 20px;">
          <span class="badge ${u.is_active?'badge-launch':'badge-skip'}">${u.is_active?'Активен':'Отключён'}</span>
        </td>
        <td style="padding:14px 20px;text-align:right;">
          <button class="btn btn-ghost text-sm" onclick="toggleUserActive('${u.id}',${u.is_active})">
            ${u.is_active?'Отключить':'Включить'}
          </button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted);">Нет пользователей</td></tr>';
  }

  // ---- Категории ----
  window.openAddCat = () => { document.getElementById('add-cat-form').style.display = 'block'; };
  window.closeCatForm = () => { document.getElementById('add-cat-form').style.display = 'none'; };

  window.addCategory = async function() {
    const name    = document.getElementById('new-cat-name').value.trim();
    const name_en = document.getElementById('new-cat-name-en').value.trim();
    const queries = document.getElementById('new-cat-queries').value.split(',').map(s=>s.trim()).filter(Boolean);
    if (!name) return;
    await supabase.from('categories').insert({ name, name_en, seed_queries: queries, is_active: true });
    closeCatForm();
    loadCategories();
  };

  window.toggleCatActive = async function(id, current) {
    await supabase.from('categories').update({ is_active: !current }).eq('id', id);
    loadCategories();
  };

  async function loadCategories() {
    const { data } = await supabase.from('categories').select('*').order('created_at');
    const grid = document.getElementById('cats-grid');
    grid.innerHTML = (data||[]).map(c => `
      <div class="card card-body" style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-weight:600;font-size:15px;">${c.name}</div>
            <div style="font-size:13px;color:var(--text-muted);">${c.name_en||''}</div>
          </div>
          <span class="badge ${c.is_active?'badge-launch':'badge-skip'}">${c.is_active?'Активна':'Пауза'}</span>
        </div>
        <div style="font-size:12px;color:var(--text-secondary);">
          ${(c.seed_queries||[]).map(q=>`<span style="background:var(--surface-2);padding:2px 8px;border-radius:20px;margin-right:4px;">${q}</span>`).join('')}
        </div>
        ${c.last_analyzed_at ? `<div style="font-size:12px;color:var(--text-muted);">Анализ: ${new Date(c.last_analyzed_at).toLocaleDateString('ru')}</div>` : ''}
        <button class="btn btn-secondary text-sm" onclick="toggleCatActive('${c.id}',${c.is_active})">
          ${c.is_active?'Поставить на паузу':'Активировать'}
        </button>
      </div>`).join('') || '<div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--text-muted);">Нет категорий</div>';
  }

  // ---- NOTы (управление) ----
  async function loadAdminNotes() {
    const { data } = await supabase.from('notes').select('*,categories(name)').order('created_at',{ascending:false});
    const el = document.getElementById('admin-notes-list');
    el.innerHTML = (data||[]).map(n => `
      <div class="card" style="display:flex;align-items:center;gap:20px;padding:16px 20px;margin-bottom:10px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;color:var(--text-muted);">${n.categories?.name||''}</div>
          <div style="font-weight:600;font-size:15px;">${n.title}</div>
        </div>
        <span class="badge ${n.status==='published'?'badge-launch':'badge-draft'}">${n.status}</span>
        <span style="font-size:20px;font-weight:700;color:${n.score>=80?'var(--green)':n.score>=60?'var(--yellow)':'var(--red)'};">${n.score}</span>
        <div style="display:flex;gap:8px;">
          ${n.status==='draft' ? `<button class="btn btn-primary text-sm" onclick="publishNote('${n.id}')">Опубликовать</button>` : `<button class="btn btn-secondary text-sm" onclick="unpublishNote('${n.id}')">В черновик</button>`}
          <a href="note.html?id=${n.id}" class="btn btn-secondary text-sm">Открыть</a>
        </div>
      </div>`).join('') || '<div style="text-align:center;padding:32px;color:var(--text-muted);">Нет NOTы</div>';
  }

  window.publishNote = async function(id) {
    await supabase.from('notes').update({ status: 'published' }).eq('id', id);
    loadAdminNotes();
  };
  window.unpublishNote = async function(id) {
    await supabase.from('notes').update({ status: 'draft' }).eq('id', id);
    loadAdminNotes();
  };

  async function init() {
    await requireAuth();
    currentUser = await getCurrentUser();
    if (!currentUser || currentUser.role !== 'admin') {
      location.href = 'index.html';
      return;
    }
    document.getElementById('nav-avatar').textContent = currentUser.name?.[0]?.toUpperCase() || currentUser.email[0].toUpperCase();
    document.getElementById('nav-name').textContent = currentUser.name || currentUser.email;
    loadUsers();
  }

  init();
</script>
</body>
</html>
